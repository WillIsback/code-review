name: AI Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

# SECURITY: pinned to the v0.7.0 release commit of WillIsback/code-review.
# Update to the full SHA of the latest reviewed release; NEVER use @main here —
# this workflow holds secrets.

jobs:
  triage:
    # Public repos: only trusted authors trigger paid inference. Relax or replace
    # with a label check if you want community triage.
    if: contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: AI Issue Triage
        uses: WillIsback/code-review@629ce71d98059ec4b70b7d3ab93094fa39483591 # v0.7.0
        with:
          target-type: issue
          target-number: ${{ github.event.issue.number }}
          vllm-model: ${{ vars.VLLM_MODEL || '' }}
          vllm-timeout: ${{ vars.VLLM_TIMEOUT || '120' }}
          vllm-retries: ${{ vars.VLLM_RETRIES || '2' }}
          vllm-url: ${{ secrets.VLLM_URL }}
          vllm-api-key: ${{ secrets.VLLM_API_KEY }}
          # Any extra headers your endpoint needs (Cloudflare Access shown as an example)
          extra-headers: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
